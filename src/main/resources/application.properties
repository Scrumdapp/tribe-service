spring.application.name=tribe-service
spring.config.import=optional:file:.env[.properties]

server.port=${APPLICATION_PORT:3000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/scrumdapp}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20

spring.jackson.property-naming-strategy=SNAKE_CASE

passport.jwk-set-uri=${JWK_SET_URI}

services.checkpointService=${CHECKPOINT_SERVICE_URL:http://localhost:3000}
services.groupService=${GROUP_SERVICE_URL:http://localhost:3000}

spring.profiles.active=use-mock-service